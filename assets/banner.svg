<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7df1e"/>
      <stop offset="100%" style="stop-color:#f0a500"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7df1e;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#f7df1e;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur-glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded">
      <rect width="1200" height="340" rx="18"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g clip-path="url(#rounded)" opacity="0.04">
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#ffffff" stroke-width="1"/>
    <line x1="100" y1="0" x2="100" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="1100" y1="0" x2="1100" y2="340" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Glow blob left -->
  <ellipse cx="200" cy="170" rx="220" ry="160" fill="url(#glow)" clip-path="url(#rounded)"/>
  <!-- Glow blob right -->
  <ellipse cx="1050" cy="180" rx="180" ry="140" fill="url(#glow)" clip-path="url(#rounded)" opacity="0.6"/>

  <!-- JS Logo block -->
  <rect x="64" y="90" width="120" height="120" rx="14" fill="#f7df1e" filter="url(#soft-glow)"/>
  <text x="78" y="174" font-family="'Segoe UI',Arial,sans-serif" font-size="66" font-weight="900" fill="#222222" letter-spacing="-2">JS</text>

  <!-- Top accent bar -->
  <rect x="64" y="72" width="120" height="5" rx="3" fill="url(#accent)"/>

  <!-- Title -->
  <text x="218" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1" filter="url(#soft-glow)">JavaScript</text>
  <text x="219" y="154" font-family="'Segoe UI',Arial,sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1">JavaScript</text>

  <!-- Subtitle -->
  <text x="220" y="196" font-family="'Segoe UI',Arial,sans-serif" font-size="26" font-weight="500" fill="#f7df1e" letter-spacing="6">INTERVIEW  PREP</text>

  <!-- Separator line -->
  <rect x="220" y="214" width="520" height="3" rx="2" fill="url(#accent)" opacity="0.7"/>

  <!-- Tags row -->
  <!-- Tag 1 -->
  <rect x="220" y="234" width="100" height="30" rx="8" fill="#21262d" stroke="#f7df1e" stroke-width="1" stroke-opacity="0.5"/>
  <text x="270" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#f7df1e" text-anchor="middle">Junior</text>

  <!-- Tag 2 -->
  <rect x="332" y="234" width="100" height="30" rx="8" fill="#21262d" stroke="#58a6ff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="382" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#58a6ff" text-anchor="middle">Middle</text>

  <!-- Tag 3 -->
  <rect x="444" y="234" width="100" height="30" rx="8" fill="#21262d" stroke="#bc8cff" stroke-width="1" stroke-opacity="0.5"/>
  <text x="494" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#bc8cff" text-anchor="middle">Senior</text>

  <!-- Tag 4 -->
  <rect x="556" y="234" width="120" height="30" rx="8" fill="#21262d" stroke="#3fb950" stroke-width="1" stroke-opacity="0.5"/>
  <text x="616" y="254" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="600" fill="#3fb950" text-anchor="middle">Advanced</text>

  <!-- Code snippet right side -->
  <g clip-path="url(#rounded)" opacity="0.55" font-family="'Fira Code','Courier New',monospace" font-size="13.5">
    <!-- Code block background -->
    <rect x="770" y="54" width="390" height="232" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Window dots -->
    <circle cx="793" cy="74" r="5" fill="#ff5f57"/>
    <circle cx="812" cy="74" r="5" fill="#febc2e"/>
    <circle cx="831" cy="74" r="5" fill="#28c840"/>
    <text x="855" y="78" font-size="11" fill="#8b949e">interview.js</text>

    <!-- Code lines -->
    <text x="786" y="108" fill="#8b949e">1  </text><text x="806" y="108" fill="#ff7b72">const </text><text x="846" y="108" fill="#79c0ff">prepare </text><text x="902" y="108" fill="#ffffff">= () </text><text x="938" y="108" fill="#ff7b72">=&gt;</text><text x="960" y="108" fill="#ffffff"> {</text>

    <text x="786" y="128" fill="#8b949e">2  </text>
    <text x="806" y="128" fill="#8b949e">  // </text><text x="840" y="128" fill="#8b949e">Topics covered</text>

    <text x="786" y="148" fill="#8b949e">3  </text>
    <text x="806" y="148" fill="#ff7b72">  const </text><text x="853" y="148" fill="#79c0ff">topics </text><text x="899" y="148" fill="#ffffff">= [</text>

    <text x="786" y="168" fill="#8b949e">4  </text>
    <text x="806" y="168" fill="#a5d6ff">    'Closures'</text><text x="905" y="168" fill="#ffffff">,</text><text x="916" y="168" fill="#a5d6ff"> 'Event Loop'</text>

    <text x="786" y="188" fill="#8b949e">5  </text>
    <text x="806" y="188" fill="#a5d6ff">    'Promises'</text><text x="905" y="188" fill="#ffffff">,</text><text x="916" y="188" fill="#a5d6ff"> 'JWT'</text>

    <text x="786" y="208" fill="#8b949e">6  </text>
    <text x="806" y="208" fill="#a5d6ff">    'Prototypes'</text><text x="912" y="208" fill="#ffffff">,</text><text x="920" y="208" fill="#a5d6ff"> 'Async'</text>

    <text x="786" y="228" fill="#8b949e">7  </text><text x="806" y="228" fill="#ffffff">  ];</text>

    <text x="786" y="248" fill="#8b949e">8  </text>
    <text x="806" y="248" fill="#ff7b72">  return </text><text x="856" y="248" fill="#79c0ff">topics</text><text x="906" y="248" fill="#ffffff">.</text><text x="912" y="248" fill="#d2a8ff">map</text><text x="940" y="248" fill="#ffffff">(study);</text>

    <text x="786" y="268" fill="#8b949e">9  </text><text x="806" y="268" fill="#ffffff">};</text>
  </g>

  <!-- Bottom caption -->
  <text x="64" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#8b949e">Матеріали для підготовки до співбесіди — Junior · Middle · Senior · Advanced</text>

  <!-- Top-right badge -->
  <rect x="1100" y="20" width="80" height="28" rx="8" fill="#238636" />
  <text x="1140" y="38" font-family="'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2026</text>

  <!-- Border -->
  <rect width="1200" height="340" rx="18" fill="none" stroke="#30363d" stroke-width="1.5"/>
</svg>
